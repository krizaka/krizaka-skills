# Dependabot auto-merge: patch and minor (grouped included) merge when the required checks pass; majors stay manual.
# Logic lives in krizaka/.github (reusable); this file only hands over the event. It does not check out or run the PR's code.
name: Dependabot auto-merge

on: pull_request_target # zizmor: ignore[dangerous-triggers] checks out nothing and runs no PR code; hands the event to the pinned reusable workflow

permissions:
  contents: read

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    uses: krizaka/.github/.github/workflows/dependabot-automerge.yml@1002810b78ccc24e284ec8209e8e0b55ff06ea33 # main
