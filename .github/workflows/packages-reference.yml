# The generated list of what every published @krizaka/* package exports (skills/krizaka-engineering/references/packages.md)
# follows the registry: daily, and by hand, the script regenerates it and, when a release changed it, opens or updates ONE
# pull request. Pull requests never read the registry (a release elsewhere never turns an unrelated pull request red).
name: Packages reference

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-reference
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Regenerate from the registry
        run: npm run gen:packages
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet; then echo "packages.md is current"; exit 0; fi
          branch=chore/packages-reference
          git config user.name "krizaka-agents[bot]"
          git config user.email "krizaka-agents[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "docs(engineering): the packages reference follows the registry"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" push --force "https://github.com/${REPO}" "$branch"
          if [ -z "$(gh pr list -R "$REPO" --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create -R "$REPO" --head "$branch" --title "docs(engineering): the packages reference follows the registry" \
              --body "Regenerated by the Packages reference workflow (npm run gen:packages) after a @krizaka/* release."
          fi
