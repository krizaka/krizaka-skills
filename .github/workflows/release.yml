# Releases: release-please keeps a « chore(main): release » pull request with the changelog and the version (package.json
# and every version in .claude-plugin/marketplace.json). Its merge tags vX.Y.Z and publishes a GitHub Release; this job then
# attaches the skills archive with a signed build provenance (Sigstore, actions/attest-build-provenance), so anyone can
# check it: `gh attestation verify krizaka-skills-<version>.zip -R krizaka/krizaka-skills`.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Sigstore signing of the provenance
      attestations: write
    steps:
      # A pull request opened with GITHUB_TOKEN starts no workflow; a GitHub App token does. Configure the repository
      # variable RELEASE_APP_ID and the secret RELEASE_APP_PRIVATE_KEY; until then GITHUB_TOKEN is used.
      - id: app
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.rp.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.rp.outputs.release_created == 'true'
        name: Build the archive
        env:
          TAG: ${{ steps.rp.outputs.tag_name }}
          VERSION: ${{ steps.rp.outputs.version }}
        run: git archive --format=zip --prefix="krizaka-skills-${VERSION}/" -o "krizaka-skills-${VERSION}.zip" "$TAG" -- skills agents .claude-plugin LICENSE README.md
      - if: steps.rp.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: krizaka-skills-${{ steps.rp.outputs.version }}.zip
      - if: steps.rp.outputs.release_created == 'true'
        name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rp.outputs.tag_name }}
          VERSION: ${{ steps.rp.outputs.version }}
        run: gh release upload "$TAG" "krizaka-skills-${VERSION}.zip" --repo "$GITHUB_REPOSITORY"
